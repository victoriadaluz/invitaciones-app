1<div class="register-container">
  <div class="register-card">
    <h2>Creá tu cuenta</h2>
    <p class="subtitle">Unite para crear invitaciones increíbles</p>

    <div *ngIf="errorMessage" class="error" role="alert">
      {{ errorMessage }}
    </div>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form" [class.loading]="loading">
      <div class="form-group">
        <label for="displayName">Nombre completo</label>
        <input 
          type="text" 
          id="displayName"
          formControlName="displayName" 
          placeholder="Tu nombre"
          [class.input-error]="displayName?.invalid && displayName?.touched"
          [class.input-success]="displayName?.valid">
        
        <div *ngIf="displayName?.invalid && displayName?.touched" class="error">
          <div *ngIf="displayName?.errors?.['required']">👤 El nombre es requerido</div>
          <div *ngIf="displayName?.errors?.['minlength']">👤 Mínimo 2 caracteres</div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email"
          formControlName="email" 
          placeholder="tu@email.com"
          [class.input-error]="email?.invalid && email?.touched"
          [class.input-success]="email?.valid">
        
        <div *ngIf="email?.invalid && email?.touched" class="error">
          <div *ngIf="email?.errors?.['required']">📧 El email es requerido</div>
          <div *ngIf="email?.errors?.['email']">📧 Email inválido</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password"
          formControlName="password" 
          placeholder="Mínimo 6 caracteres"
          [class.input-error]="password?.invalid && password?.touched"
          [class.input-success]="password?.valid">
        
        <div *ngIf="password?.invalid && password?.touched" class="error">
          <div *ngIf="password?.errors?.['required']">🔒 Contraseña requerida</div>
          <div *ngIf="password?.errors?.['minlength']">🔒 Mínimo 6 caracteres</div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input 
          type="password" 
          id="confirmPassword"
          formControlName="confirmPassword" 
          placeholder="Repetí tu contraseña"
          [class.input-error]="!passwordsMatch() && confirmPassword?.touched">
        
        <div *ngIf="!passwordsMatch() && confirmPassword?.touched" class="password-mismatch">
          🔒 Las contraseñas no coinciden
        </div>
      </div>

      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="registerForm.invalid || !passwordsMatch() || loading">
        <span *ngIf="!loading">🎊 Crear cuenta</span>
        <span *ngIf="loading">⏳ Creando cuenta...</span>
      </button>
    </form>
    
    <div class="links">
      <a routerLink="/login">↶ ¿Ya tenés cuenta? Ingresá</a>
      <a routerLink="/">🏠 Volver al inicio</a>
    </div>
  </div>
</div>
